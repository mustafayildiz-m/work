# Geçici: Sadece port 80 - certbot sertifika almak için
# Sertifikalar alındıktan sonra default.conf geri yüklenecek

server {
    listen 80;
    server_name islamicwindows.com www.islamicwindows.com islamicwindows.org www.islamicwindows.org;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 200 'Sertifika alınıyor...';
        add_header Content-Type text/plain;
    }
}
