server {
    listen 80;
    server_name islamicwindows.com www.islamicwindows.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://islamicwindows.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.islamicwindows.com;
    ssl_certificate /etc/letsencrypt/live/islamicwindows.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/islamicwindows.org/privkey.pem;
    return 301 https://islamicwindows.com$request_uri;
}

server {
    listen 443 ssl;
    server_name islamicwindows.com;
    ssl_certificate /etc/letsencrypt/live/islamicwindows.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/islamicwindows.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- SPECIFIC BACKEND AUTH ROUTES (HIGHEST PRIORITY) ---
    # Bu bloklar NextAuth'un (/api/auth/) onune gecmeli.
    
    # 1. Login
    location ^~ /api/auth/login {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 100M;
    }

    # 2. Register
    location ^~ /api/auth/register {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 100M;
    }

    # 3. Me (Kullanici Bilgisi)
    location ^~ /api/auth/me {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 4. Verify
    location ^~ /api/auth/verify {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 5. Forgot Password
    location ^~ /api/auth/forgot-password {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 6. Reset Password
    location ^~ /api/auth/reset-password {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --- NextAuth Endpoints (Diğerleri) ---
    # Signin, signout, session vb. User Frontend'e gider
    location ^~ /api/auth/ {
        proxy_pass http://user-front:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- PDF Download (User-Front Next.js API) ---
    location ^~ /api/download-pdf {
        proxy_pass http://user-front:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # --- UPLOADS via /api/uploads/ (frontend NEXT_PUBLIC_API_URL + /uploads/...) ---
    # Aynı dosyalar /uploads/ altında da servis edilir; bu blok genel /api/ proxy'sinden önce olmalı.
    location ^~ /api/uploads/ {
        alias /app/uploads/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # --- BACKEND API (Genel) ---
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        client_max_body_size 100M;
    }

    # --- SOCKET.IO (Engine.IO + WebSocket upgrade; polling için Connection doğru olmalı) ---
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- SOCKET.IO /chat namespace ---
    location /chat/socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- ADMIN PANEL ---
    location /admin/ {
        proxy_pass http://admin-front:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --- UPLOADS ---
    location /uploads/ {
        alias /app/uploads/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # --- ANA FRONTEND ---
    location / {
        proxy_pass http://user-front:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
