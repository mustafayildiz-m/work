name: Test & Coverage Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests with coverage
        run: npm run test:cov
        working-directory: backend

      - name: Check coverage threshold (80% lines)
        run: |
          COVERAGE=$(npx jest --coverage --coverageReporters=json-summary 2>/dev/null && cat coverage/coverage-summary.json | node -e "
            const data = require('./coverage/coverage-summary.json');
            const pct = data.total.lines.pct;
            console.log(pct);
            if (pct < 80) {
              console.error('Coverage ' + pct + '% is below 80% threshold');
              process.exit(1);
            }
          ")
        working-directory: backend
        continue-on-error: true

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: user-front/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: user-front

      - name: Run tests with coverage
        run: npm run test:cov
        working-directory: user-front

  admin-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: admin-front/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: admin-front

      - name: Run tests
        run: npm test
        working-directory: admin-front
